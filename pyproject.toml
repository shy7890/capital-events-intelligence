[project]
name = "capital-events-intelligence"
version = "0.1.0"
description = "面向中国 A 股公司行动与资本事件的事件驱动研究工作流"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "requests>=2.32",
    "pandas>=2.2,<3",  # 3.x 移除了 DataFrame.append，baostock 0.9.3 内部仍在使用（2026-09-02 实测）
    "openpyxl>=3.1",
    "akshare==1.18.81",
    "baostock>=0.8.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhuang_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
